[package]
name = "tatiana_munchieverse_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.87"
glam = { version = "0.24.1", features = ["wasm-bindgen"] }
console_error_panic_hook = "0.1.7"
mlua = { version = "0.8", features = ["lua54", "vendored"] }

[profile.release]
lto = true
opt-level = "s"
